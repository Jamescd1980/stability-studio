<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Myra</title>
  <style>
    :root {
      --accent: #3ec7ff;
      --text: #e8eef5;
      --muted: #7f93a8;
      --ok: #3dff9a;
      --display: "Nunito Sans", "DejaVu Sans", "Segoe UI", sans-serif;
      --mono: "Liberation Mono", "DejaVu Sans Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: none;
      user-select: none;
      color: var(--text);
      font-family: var(--display);
      background: #070b10;
    }
    /* Ultrawide bar (~1920×515 / 4"×12") — fill every pixel edge-to-edge */
    body::before {
      content: "";
      position: fixed; inset: 0;
      background:
        radial-gradient(45% 160% at 18% 50%, rgba(62,199,255,.16), transparent 60%),
        radial-gradient(40% 160% at 82% 50%, rgba(61,255,154,.08), transparent 55%),
        linear-gradient(90deg, #05080c 0%, #0c141d 50%, #05080c 100%);
      z-index: 0;
    }
    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) auto minmax(0, 1.15fr);
      align-items: center;
      gap: clamp(12px, 2vw, 36px);
      padding: clamp(10px, 2.2vh, 18px) clamp(20px, 2.5vw, 48px);
    }
    .panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }
    .brand {
      font-size: clamp(11px, 2.4vh, 14px);
      font-weight: 800;
      letter-spacing: .28em;
      color: var(--accent);
      text-shadow: 0 0 14px rgba(62,199,255,.35);
      margin-bottom: 4px;
    }
    .name {
      font-size: clamp(42px, 14vh, 72px);
      font-weight: 800;
      line-height: .92;
      letter-spacing: .02em;
    }
    .tag {
      margin-top: 6px;
      font-size: clamp(14px, 4vh, 22px);
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .center {
      align-items: center;
      text-align: center;
    }
    .orb-wrap {
      position: relative;
      width: clamp(88px, 28vh, 140px);
      height: clamp(88px, 28vh, 140px);
      margin: 0 auto;
    }
    .orb {
      position: absolute; inset: 12%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 35%),
        radial-gradient(circle at 50% 55%, rgba(62,199,255,.55), rgba(10,20,30,.9) 70%);
      box-shadow:
        0 0 28px rgba(62,199,255,.35),
        inset 0 0 22px rgba(62,199,255,.25);
      animation: breathe 4.5s ease-in-out infinite;
    }
    .ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(62,199,255,.22);
      animation: spin 18s linear infinite;
    }
    .ring::before {
      content: "";
      position: absolute;
      top: -3px; left: 50%;
      width: 7px; height: 7px;
      margin-left: -3.5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .listen {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      color: var(--muted);
      font-size: clamp(12px, 3.2vh, 16px);
      font-weight: 700;
      letter-spacing: .14em;
    }
    .listen i {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 10px var(--ok);
      animation: blink 2s ease-in-out infinite;
    }
    .clock {
      font-family: var(--mono);
      font-size: clamp(48px, 16vh, 84px);
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1;
      text-align: right;
      text-shadow: 0 0 24px rgba(62,199,255,.15);
    }
    .date {
      margin-top: 8px;
      text-align: right;
      font-size: clamp(14px, 4vh, 22px);
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hint {
      margin-top: 10px;
      text-align: right;
      font-size: clamp(11px, 2.8vh, 15px);
      font-weight: 600;
      color: rgba(127,147,168,.9);
      line-height: 1.3;
      max-width: none;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.04); filter: brightness(1.12); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: .35; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel">
      <div class="brand">STUDIO EDGE</div>
      <div class="name">Myra</div>
      <div class="tag">Room · listening</div>
    </section>
    <section class="panel center">
      <div class="orb-wrap">
        <div class="ring"></div>
        <div class="orb"></div>
      </div>
      <div class="listen"><i></i><span>HEY MYRA</span></div>
    </section>
    <section class="panel">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">—</div>
      <div class="hint">Mute/unmute to wake · “what time is it”</div>
    </section>
  </div>
  <script>
    function tick() {
      const d = new Date();
      document.getElementById("clock").textContent = d.toLocaleTimeString([], {
        hour: "numeric", minute: "2-digit",
      });
      document.getElementById("date").textContent = d.toLocaleDateString([], {
        weekday: "short", month: "short", day: "numeric",
      });
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
