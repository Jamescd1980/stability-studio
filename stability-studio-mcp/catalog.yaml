# Style presets — pick by id from list_styles() or natural language (aliases).
# Pass checkpoint= to override any style.
#
# Model families (architecture, workflow, sampler guidance): see model_families below
# and MODEL-FAMILIES.md. Agents: call get_generation_context → style_readiness.

model_families:
  sdxl:
    label: "SDXL checkpoint"
    workflow: checkpoint_txt2img
    comfy_nodes:
      - CheckpointLoaderSimple
      - CLIPTextEncode
      - KSampler
      - VAEDecode
    prompt_style: "Comma tags and negative prompts work well. Quality tags optional."
    typical_defaults:
      steps: 28
      cfg: 6.0
      sampler: dpmpp_2m
      scheduler: karras
      width: 1024
      height: 1024
    requires:
      - role: checkpoint
        folder: checkpoints
        stability_matrix_folder: StableDiffusion
    common_errors:
      - "CLIP input invalid → checkpoint is Flux/Wan, not SDXL; switch architecture"
    vram_hint_gb: "8–12 typical at 1024²"

  sdxl_anime:
    extends: sdxl
    label: "SDXL anime / illustration"
    prompt_style: "masterpiece, best quality prefixes; avoid photorealistic in negatives"
    typical_defaults:
      sampler: euler_ancestral
      scheduler: normal
      cfg: 6.0

  sd15:
    label: "Stable Diffusion 1.5 checkpoint"
    workflow: checkpoint_txt2img
    comfy_nodes:
      - CheckpointLoaderSimple
      - CLIPTextEncode
      - KSampler
      - VAEDecode
    prompt_style: "Comma tags and negative prompts; native res often 512×768."
    typical_defaults:
      steps: 30
      cfg: 5.0
      sampler: dpmpp_2m_sde
      scheduler: karras
      width: 512
      height: 768
    requires:
      - role: checkpoint
        folder: checkpoints
        stability_matrix_folder: StableDiffusion
    common_errors:
      - "y is None / SDXL ControlNet on SD1.5 → use sd15 controlnets or switch to SDXL style"
      - "Do not use SDXL IP-Adapter or SDXL ControlNet with sd15 checkpoints"
    vram_hint_gb: "4–8 at 512×768"
    note: "SD 1.5 checkpoints removed from catalog — use juggernaut or miracle_nsfw for photoreal"

  pony_sdxl:
    extends: sdxl
    label: "Pony SDXL"
    prompt_style: "score_9, score_8_up, score_7_up prefix; score_6… in negatives (Civitai Pony grammar)"
    typical_defaults:
      cfg: 5.5
      sampler: dpmpp_2m
      scheduler: karras

  flux2_klein:
    label: "Flux.2 Klein"
    workflow: flux2_klein_txt2img
    comfy_nodes:
      - UNETLoader
      - CLIPLoader
      - VAELoader
      - CLIPTextEncode
      - EmptyFlux2LatentImage
      - Flux2Scheduler
      - CFGGuider
      - SamplerCustomAdvanced
      - VAEDecode
    prompt_style: "Short natural language (40–120 words). Long SDXL-style negatives mostly ignored."
    typical_defaults:
      steps: 20
      cfg: 3.5
      sampler: euler
      scheduler: simple
      width: 1024
      height: 1024
    requires:
      - role: unet
        folder: diffusion_models
        stability_matrix_folder: DiffusionModels
        note: "Single-file Klein checkpoints in StableDiffusion must also appear in DiffusionModels (copy or hard-link) for UNETLoader"
      - role: clip
        folder: text_encoders
        stability_matrix_folder: TextEncoders
        default: qwen_3_8b_fp8mixed.safetensors
        klein_4b_alt: qwen_3_4b.safetensors
      - role: vae
        folder: vae
        stability_matrix_folder: VAE
        default: full_encoder_small_decoder.safetensors
        klein_4b_alt: flux2-vae.safetensors
    common_errors:
      - "CLIP input invalid → do not use CheckpointLoaderSimple; use flux2_klein workflow"
      - "UNET not in list → hard-link checkpoint from StableDiffusion to DiffusionModels"
      - "easy fluxLoader IndexError → Miracle/Klein has no bundled CLIP; use native Flux2 nodes"
    vram_hint_gb: "12–16 for 9B nvfp4 at 1024²"

  wan_video:
    label: "Wan video (T2V / I2V)"
    workflow: ui_json_converted
    prompt_style: "Natural language; workflow-specific encode nodes (WanVideoTextEncode)"
    note: "Uses saved workflow JSON in Stability Matrix Data/Workflows. Asset manifest in wan_assets.py / WAN-ASSETS.md"
    requires:
      - role: workflow_json
        folder: workflows
      - role: diffusion_model
        folder: diffusion_models
      - role: text_encoder
        folder: text_encoders
      - role: vae
        folder: vae
    setup_notes:
      - "Set VHS_USE_IMAGEIO_FFMPEG=1 before starting ComfyUI for MP4 output"
      - "Default I2V catalog id i2v_5b — call check_wan_assets before first run"
      - "Optional LoRAs: check_wan_video_loras / download_wan_video_loras (studio/wan_video_loras.py)"
      - "PainterI2V motion: workflow_id=i2v_5b_painter or use_painter_i2v=true — install_painter_i2v_dependencies first"

  hunyuan_video_15:
    label: "HunyuanVideo 1.5 (T2V / I2V)"
    workflow: ui_json_converted
    prompt_style: "Natural language; Qwen2.5-VL + ByT5 glyph encoder (ComfyUI HunyuanVideo nodes)"
    note: "Assets via check_hunyuan_assets / download_hunyuan_assets (hunyuan_assets.py). generate_video routing TBD — use ComfyUI template workflows until wired."
    requires:
      - role: workflow_json
        folder: workflows
        note: "Comfy-Org/workflow_templates — not yet wired in MCP engine"
      - role: diffusion_model
        folder: diffusion_models
      - role: text_encoder
        folder: text_encoders
        default: qwen_2.5_vl_7b_fp8_scaled.safetensors
      - role: glyph_encoder
        folder: text_encoders
        default: byt5_small_glyphxl_fp16.safetensors
      - role: vae
        folder: vae
        default: hunyuanvideo15_vae_fp16.safetensors
    setup_notes:
      - "Call check_hunyuan_assets(workflow_id=hunyuan_t2v|hunyuan_i2v) before first run"
      - "RTX 5090 / 32 GB recommended for 720p; store on Game drive (GENERATION_HOST <MODELS_MOUNT>/...)"
      - "Optional 1080p SR: workflow_id=hunyuan_sr — hunyuanvideo1.5_1080p_sr_distilled_fp16.safetensors"
      - "Distilled I2V/T2V variants on HF: *_cfg_distilled_fp16, *_step_distilled_fp16, 480p_*"
    vram_hint_gb: "24–32 for 720p T2V/I2V"

# Style lanes — CreateBrain voice/prompt resolver (finer than food groups).
# Voice pattern: medium + mood(+lighting) + cast axes + subject/action.
# Example: "retro anime with cyber lighting of Esil in armor casting at a monster"
#   → medium=anime_retro, mood=cyber, subject=female, grouping=solo, content=action
# Food groups stay the coarse MCP switch; lanes pick checkpoint / LoRA / neg defaults.
style_lanes:
  howto: >
    Parse the ask into medium → mood → cast axes, then apply the matching recipe.
    "Anime" alone is too coarse — always prefer a medium substyle when the user hints one.
    Merge rule when medium and mood disagree on checkpoint:
      (1) If mood is cyber/gold_standard/dark_fantasy and names a default_style, use that
          checkpoint and keep the medium's prompt_tail + negative_extra (recreate_005 pattern).
      (2) Otherwise use medium.default_style and apply mood prompt_tail / loras / negatives.
    Cast axes pick checkpoint role (A/B women+NSFW vs C groups) when the user doesn't name a style id.
    Monster/opponent in frame does NOT force grouping=group — still solo hero vs foe unless
    multiple named cast members.

  media:
    cartoon_american:
      label: American cartoon
      food_group: anime
      aliases: [cartoon, western cartoon, disney-ish, toon]
      default_style: dynavision_3d
      look_profile: null
      prompt_tail: "american cartoon style, clean cel shading, bold outlines, expressive faces"
      negative_extra: "photorealistic, 3d render, japanese anime eyes, moe, detailed skin pores"
      notes: Western toon / satirical — not Japanese anime grammar.

    anime_modern:
      label: Modern anime
      food_group: anime
      aliases: [anime, modern anime, current anime, tv anime]
      default_style: ilustmix
      look_profile: illustrious_detail_hero
      prompt_tail: "modern anime illustration, clean linework, contemporary coloring"
      negative_extra: "1990s anime, grainy film, watercolor bleed, western cartoon, photorealistic"
      notes: Default Illustrious lane when user just says anime.

    anime_retro:
      label: Retro anime (80s/90s)
      food_group: anime
      aliases: [retro anime, 80s anime, 90s anime, classic anime, old anime]
      default_style: aom2
      look_profile: traditional_jp_anime
      prompt_tail: >
        1990s anime style, cel animation, film grain, soft gradients, classic anime coloring,
        hand-painted backgrounds
      negative_extra: >
        modern anime, 2020s style, hyper detailed skin, 3d cgi, western cartoon,
        oversharp, AI sheen, plastic skin
      notes: recreate_004 lean — traditional Japanese anime look.

    anime_dark:
      label: Dark anime
      food_group: anime
      aliases: [dark anime, grim anime]
      default_style: waijfu
      look_profile: dark_gothic_anime
      prompt_tail: "dark anime, high contrast, deep shadows, moody atmosphere"
      negative_extra: "bright pastel, sunny day, soft moe, watercolor wash, flat lighting"
      notes: recreate_001/002 lean — often pairs with gothic mood.

    cgi:
      label: CGI / stylized 3D
      food_group: fantasy
      aliases: [cgi, 3d, pixar, stylized 3d]
      default_style: dynavision_3d
      look_profile: null
      prompt_tail: "stylized 3D CGI render, subsurface skin, soft global illumination"
      negative_extra: "2d anime, flat cel, sketch, watercolor, photorealistic photo"
      notes: DynaVision lane — not 2D anime.

    watercolor:
      label: Watercolor illustration
      food_group: fantasy
      aliases: [watercolor, watercolour, painted]
      default_style: merged_dreams
      look_profile: traditional_jp_anime
      prompt_tail: "watercolor illustration, soft pigment bleed, paper texture, painterly"
      negative_extra: "hard cel lines, neon cyberpunk, photorealistic, plastic skin, 3d cgi"
      notes: Overlaps recreate_004 traditional finish when soft/painterly.

  moods:
    traditional:
      label: Traditional lighting / color
      aliases: [traditional, classic lighting, natural light]
      prompt_tail: "natural lighting, balanced colors, clear read, soft ambient light"
      negative_extra: "neon, cyberpunk glow, lens flare spam, rainbow light leak, harsh rim"
      loras: []
      notes: Neutral — lets medium carry the look.

    gothic:
      label: Gothic
      aliases: [gothic, goth, goth girl]
      prompt_tail: "gothic atmosphere, cool shadows, muted palette, dark elegance"
      negative_extra: "bright neon pink, sunny beach, pastel candy colors, cheerful lighting"
      loras:
        - file: Eyes_for_Illustrious_Lora_Perfect_anime_eyes.safetensors
          weight: 0.75
      look_profile: dark_gothic_anime
      notes: recreate_001/002 — goth girl lean.

    cyber:
      label: Cyber lighting and color
      aliases: [cyber, cyberpunk lighting, neon, synthwave]
      food_group_hint: cyberpunk
      default_style: n4mik4
      prompt_tail: >
        cyberpunk lighting, neon rim light, magenta and cyan accents, wet streets glow,
        volumetric neon haze
      negative_extra: "daylight pastoral, watercolor wash, medieval torch only, flat anime cel"
      loras: []
      look_profile: anime_cyber
      notes: recreate_005 — anime medium + cyber mood often uses n4mik4.

    dark_fantasy:
      label: Dark fantasy action
      aliases: [dark fantasy, grimdark, monster fight]
      food_group_hint: fantasy
      default_style: fantasy_prime
      prompt_tail: >
        dark fantasy, dramatic volumetric light, blood and grit optional, epic combat staging,
        monster scale contrast
      negative_extra: "cute chibi, slice of life, bright school anime, soft pastel"
      loras:
        - file: New_Fantasy_CoreV5_-_ILL.safetensors
          weight: 0.55
          optional: true
      notes: Fragarach / monster fights — mood for action, not a medium.

    gold_standard:
      label: Gold standard finish (recreate_003 bar)
      aliases: [gold standard, detail hero, park heejin bar, recreate 003]
      default_style: waijfu
      look_profile: illustrious_detail_hero
      prompt_tail: "highly detailed, intricate, sharp focus, absurdres, perfect eyes, eye_focus"
      negative_extra: >
        plastic skin, soft face, muddy shading, flat color, oversmoothed,
        anatomical artifact, deformed crotch
      notes: Finish quality bar — apply when user wants hero still polish.

  cast_axes:
    subject:
      - id: woman
        aliases: [woman, girl, female, 1girl]
      - id: man
        aliases: [man, boy, male, 1boy]
      - id: mixed
        aliases: [mixed, couple, both]
    grouping:
      - id: solo
        aliases: [solo, alone, single, 1girl, 1boy]
      - id: pair
        aliases: [pair, duo, two people, 2girls, 2boys]
      - id: group
        aliases: [group, crowd, multiple people, party]
    content:
      - id: nsfw
        aliases: [nsfw, nude, explicit, sex, erotic]
      - id: action
        aliases: [action, fight, combat, spell, battle, shooting]
      - id: portrait
        aliases: [portrait, beauty shot, face focus, sfw portrait]

  # Informal checkpoint roles (your A / B / C lean).
  checkpoint_roles:
    A_women_nsfw:
      label: Checkpoint A — women / NSFW lean
      styles: [waijfu, ilustmix]
      prefer_when: { subject: [woman], grouping: [solo, pair], content: [nsfw, portrait] }
      notes: Illustrious family solo-female keepers.
    B_women_nsfw:
      label: Checkpoint B — women / NSFW alternate
      styles: [pony, miracle_nsfw]
      prefer_when: { subject: [woman], grouping: [solo], content: [nsfw] }
      notes: Pony grammar or Flux NSFW when Illustrious isn't the ask.
    C_groups:
      label: Checkpoint C — multiple people / groups
      styles: [animagine_xl, perfection_25d, n4mik4]
      prefer_when: { grouping: [pair, group] }
      notes: Prefer when cast is crowd / multi-character staging.

  # Voice → recipe cheat sheet (recreate map)
  recreate_map:
    recreate_001: { media: anime_dark, mood: gothic, notes: goth girl lean }
    recreate_002: { media: anime_dark, mood: gothic, notes: darker anime / goth }
    recreate_003: { media: anime_modern, mood: gold_standard, notes: detail hero bar }
    recreate_004: { media: anime_retro, mood: traditional, notes: traditional JP anime / watercolor }
    recreate_005: { media: anime_modern, mood: cyber, notes: anime + cyber lighting }

