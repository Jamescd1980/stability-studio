# Four art "food groups" — pass food_group= to edit_image / generate_image
art_food_groups:
  anime:
    label: Anime
    default_style: ilustmix
    styles: [anime, ilustmix, animagine_xl, aom2, waijfu, homochi, perfection_25d, noobai_vpred, anime_v160]
    description: "ilustmix default; WAI Illustrious v17, Animagine, AOM2, Homochi, Perfection 2.5D, NoobAI v-pred"
  fantasy:
    label: Fantasy art
    default_style: merged_dreams
    styles: [merged_dreams, pony, fantasy_prime, dynavision_3d]
    description: "Merged In Dreams, Prefect Pony, FantasyPrime 2.5D, DynaVision 3D CGI"
    prompt_guide: >-
      Keep merged_dreams; steer with prompt only. Pony score prefix (score_9, score_8_up, score_7_up)
      then subject → action → environment → lighting → one style phrase.
      Fantasy tags: high fantasy illustration, ethereal atmosphere, magical glow, ornate armor,
      enchanted forest, volumetric light, painterly, dreamy. Negate score_6… in negative; avoid
      photorealistic unless you want a realism bleed. 40–80 words beats keyword dumps on SDXL/Pony.
  cyberpunk:
    label: Cyberpunk
    default_style: n4mik4
    styles: [n4mik4, n4mik4_v10, juggernaut]
    description: "n4mik4 v20 hero shots (v10 legacy), neon sci-fi via prompt"
  photoreal:
    label: Photorealistic
    default_style: juggernaut
    styles: [juggernaut, miracle_nsfw, realisian, realvis_xl, perfection_25d]
    description: "Juggernaut, Flux2 miracle_nsfw, Realisian, RealVis XL, Perfection 2.5D hybrid"

