    description: "Wan 2.2 I2V-A14B MoE HIGH+LOW (identity/NSFW 14B — API builder)"
    file: "workflow-wan22-i2v-a14b-moe-comfyui-native.json"
    api_builder: wan22_i2v_moe
    prompt_nodes:
      - type: "CLIPTextEncode"
        role: positive
      - type: "CLIPTextEncode"
        role: negative
    note: >
      Dual UNET HIGH→LOW KSamplerAdvanced. Default stacks LightX2V distill HIGH/LOW when
      installed; action LoRAs must be HIGH+LOW pairs (e.g. female_orgasm). Do not use i2v_5b
      for uncensored NSFW. Legacy single-UNET Wan 2.1: i2v_wan21_native.

