    description: "Wan 2.2 MoE First-Last-Frame (FLF2V) — start+end keys, short dual-face/hard contact"
    file: "workflow-wan22-i2v-a14b-moe-comfyui-native.json"
    api_builder: wan22_flf2v_moe
    mode: i2v
    prompt_nodes:
      - type: "CLIPTextEncode"
        role: positive
      - type: "CLIPTextEncode"
        role: negative
    note: >
      Same HIGH+LOW MoE as i2v but WanFirstLastFrameToVideo. Requires image_path (start)
      + end_image_path (last key). Prefer num_frames=21 for dual-face / hard contact.
      Quality MoE only for keepers; one verb. Not for multi-thrust 49f doggy.

