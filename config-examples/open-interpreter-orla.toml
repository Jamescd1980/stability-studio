# Open Interpreter + Orla (local Ollama)
# Desktop app: %APPDATA%/Interpreter/codex-home/config.toml
# CLI: ~/.openinterpreter/config.toml
#
# Re-apply with: python ollama/orla/configure_open_interpreter.py
# Restart Open Interpreter fully after editing.

[model_providers.ollama]
base_url = "http://127.0.0.1:11434/v1"
name = "Ollama (Orla)"
requires_openai_auth = false
wire_api = "chat"

